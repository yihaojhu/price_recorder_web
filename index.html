<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>價格記錄器</title>
  <meta name="description" content="Grocery price tracker PWA">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Inter', sans-serif;
      --color-surface: #1e293b;
      --color-surface-alt: #334155;
      --color-brand: #38bdf8;
      --color-brand-dim: #0284c7;
      --color-accent: #a78bfa;
      --color-success: #34d399;
      --color-danger: #f87171;
      --color-warning: #fbbf24;
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-glass: rgba(30, 41, 59, 0.75);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-surface-alt); border-radius: 999px; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(56,189,248,0.3); }
      50%       { box-shadow: 0 0 20px rgba(56,189,248,0.6); }
    }
    .animate-fade-in   { animation: fadeSlideUp 0.4s ease-out both; }
    .animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }

    .glass-card {
      background: var(--color-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148,163,184,0.1);
    }

    input[type="file"]::file-selector-button { display: none; }
    * { -webkit-tap-highlight-color: transparent; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>

<body class="bg-slate-900 text-text font-sans min-h-dvh flex flex-col items-center">

  <div id="app" class="w-full max-w-[480px] min-h-dvh flex flex-col pb-24 relative">

    <!-- ─── HEADER ─── -->
    <header class="sticky top-0 z-50 glass-card px-4 py-3 flex items-center justify-between border-b border-slate-700/50">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand to-accent flex items-center justify-center shadow-lg shadow-brand/20">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.5.5-.1 1.3.6 1.3H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight">價格記錄器</h1>
          <p class="text-[11px] text-text-muted leading-tight">Price Tracker</p>
        </div>
      </div>
      <div id="dbStatusBadge"
        class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-700 text-text-muted transition-all duration-300">
        空資料庫
      </div>
    </header>

    <!-- ─── TOAST ─── -->
    <div id="toast"
      class="fixed top-16 left-0 right-0 mx-auto z-[100] px-4 py-2.5 rounded-xl glass-card shadow-2xl text-sm font-medium transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none max-w-[420px] w-[calc(100%-2rem)] text-center">
    </div>

    <!-- ═══════════════ SECTION 1: DATABASE ═══════════════ -->
    <section class="px-4 pt-4 animate-fade-in">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="flex items-center gap-2 mb-1">
          <svg class="w-4 h-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 7v10c0 2.2 3.6 4 8 4s8-1.8 8-4V7M4 7c0 2.2 3.6 4 8 4s8-1.8 8-4M4 7c0-2.2 3.6-4 8-4s8 1.8 8 4m0 5c0 2.2-3.6 4-8 4s-8-1.8-8-4" />
          </svg>
          <span class="text-sm font-semibold text-text-muted uppercase tracking-wider">Database</span>
        </div>
        <button onclick="openFile()"
          class="flex items-center justify-center gap-2 w-full py-3 rounded-xl border-2 border-dashed border-slate-600 hover:border-brand/60 text-text-muted hover:text-brand transition-all duration-200 active:scale-[0.98]">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" />
          </svg>
          <span class="text-sm font-medium">開啟 JSON 資料庫</span>
        </button>
        <!-- Recent files (rendered by JS) -->
        <div id="recentFilesList"></div>
      </div>
    </section>

    <!-- ═══════════════ SECTION 2: PRODUCT GRID ═══════════════ -->
    <section class="px-4 pt-3 animate-fade-in" style="animation-delay: 0.05s;">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
            </svg>
            <span class="text-sm font-semibold text-text-muted uppercase tracking-wider">商品</span>
          </div>
          <button onclick="startNewProduct()"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand/15 text-brand text-xs font-semibold hover:bg-brand/25 transition-colors active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
            </svg>
            拍照新增
          </button>
        </div>

        <!-- 2-column product grid -->
        <div id="productGrid" class="grid grid-cols-2 gap-2.5">
          <p class="col-span-2 text-center py-8 text-sm text-text-muted leading-relaxed">
            尚無商品<br>點選「拍照新增」開始記錄
          </p>
        </div>
      </div>
    </section>

    <!-- ═══════════════ SECTION 3: PRODUCT DETAIL ═══════════════ -->
    <section id="productSection" class="px-4 pt-3 hidden">
      <div class="glass-card rounded-2xl p-4 space-y-4 animate-fade-in">

        <!-- Back + title + badge -->
        <div class="flex items-center gap-3">
          <button onclick="closeProduct()"
            class="w-8 h-8 rounded-lg bg-slate-700/60 flex items-center justify-center active:scale-90 transition-transform shrink-0">
            <svg class="w-4 h-4 text-text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
          </button>
          <span class="text-sm font-semibold text-text-muted uppercase tracking-wider flex-1">商品詳情</span>
          <span id="productBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full"></span>
        </div>

        <!-- Photo + product name side by side -->
        <div class="flex gap-3 items-start">

          <!-- Photo (tap to retake) -->
          <div class="relative shrink-0">
            <button id="noPhotoPlaceholder" onclick="retakePhoto()"
              class="w-[72px] h-[72px] rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center gap-1 text-text-muted hover:border-brand/60 hover:text-brand transition-all active:scale-95">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
              </svg>
              <span class="text-[10px] font-medium">拍照</span>
            </button>
            <div id="photoDisplay" class="hidden relative">
              <img id="productPhoto" class="w-[72px] h-[72px] object-cover rounded-xl" alt="商品照片">
              <button onclick="retakePhoto()"
                class="absolute -bottom-1.5 -right-1.5 w-6 h-6 bg-slate-800 border border-slate-600 rounded-full flex items-center justify-center active:scale-90 transition-transform">
                <svg class="w-3 h-3 text-text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Product name -->
          <div class="flex-1">
            <label class="text-xs text-text-muted font-medium mb-1 block">商品名稱</label>
            <input id="productName" type="text" placeholder="輸入商品名稱…"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-text placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand/50 transition-all" />
          </div>
        </div>

        <!-- ── Add Price Record Form ── -->
        <div id="recordForm" class="bg-slate-800/40 rounded-xl p-3.5 space-y-3 border border-slate-700/40" style="display:none">
          <span class="text-xs font-bold text-brand uppercase tracking-wider">新增價錢記錄</span>

          <!-- Store selector -->
          <div>
            <label class="text-[11px] text-text-muted mb-0.5 block">購買處</label>
            <div class="flex gap-2">
              <select id="storeSelect"
                class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-text focus:outline-none focus:ring-2 focus:ring-brand/50 appearance-none cursor-pointer">
              </select>
              <button onclick="showAddStore()" title="新增購買處"
                class="w-11 bg-slate-700 border border-slate-600 rounded-lg flex items-center justify-center text-text-muted hover:text-brand hover:border-brand/50 transition-colors active:scale-95 shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </button>
            </div>
            <!-- New store input (hidden by default) -->
            <div id="addStoreRow" class="mt-2 gap-2 items-center" style="display:none">
              <input id="newStoreName" type="text" placeholder="新購買處名稱"
                class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-text placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-brand/50" />
              <button onclick="confirmNewStore()"
                class="px-3 py-2 bg-success/80 text-slate-900 rounded-lg text-sm font-bold active:scale-95 transition-transform shrink-0">確認</button>
              <button onclick="cancelAddStore()"
                class="px-3 py-2 bg-slate-700 text-text-muted rounded-lg text-sm active:scale-95 transition-transform shrink-0">取消</button>
            </div>
          </div>

          <!-- Price / Qty row -->
          <div class="flex gap-2">
            <div class="flex-1">
              <label class="text-[11px] text-text-muted mb-0.5 block">總價 (NT$)</label>
              <input id="priceInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
                class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-text focus:outline-none focus:ring-2 focus:ring-brand/50 transition-all" />
            </div>
            <div class="w-[68px]">
              <label class="text-[11px] text-text-muted mb-0.5 block">數量</label>
              <input id="qtyInput" type="number" inputmode="decimal" min="0.001" step="any" placeholder="1"
                class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-text focus:outline-none focus:ring-2 focus:ring-brand/50 transition-all" />
            </div>
          </div>

          <!-- Unit selector -->
          <div>
            <label class="text-[11px] text-text-muted mb-0.5 block">單位</label>
            <div class="flex gap-2">
              <select id="unitSelect"
                class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 text-text focus:outline-none focus:ring-2 focus:ring-brand/50 appearance-none cursor-pointer">
              </select>
              <button onclick="showAddUnit()" title="新增單位"
                class="w-11 bg-slate-700 border border-slate-600 rounded-lg flex items-center justify-center text-text-muted hover:text-brand hover:border-brand/50 transition-colors active:scale-95 shrink-0">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
              </button>
            </div>
            <!-- New unit input (hidden by default) -->
            <div id="addUnitRow" class="mt-2 gap-2 items-center" style="display:none">
              <input id="newUnitName" type="text" placeholder="新單位名稱"
                class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-text placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-brand/50" />
              <button onclick="confirmNewUnit()"
                class="px-3 py-2 bg-success/80 text-slate-900 rounded-lg text-sm font-bold active:scale-95 transition-transform shrink-0">確認</button>
              <button onclick="cancelAddUnit()"
                class="px-3 py-2 bg-slate-700 text-text-muted rounded-lg text-sm active:scale-95 transition-transform shrink-0">取消</button>
            </div>
          </div>

          <!-- Save / cancel-edit buttons -->
          <div class="flex gap-2">
            <button id="saveBtn" onclick="saveRecord()"
              class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-success/90 to-emerald-500/80 text-slate-900 font-bold text-sm active:scale-[0.97] transition-transform shadow-lg shadow-success/20 flex items-center justify-center gap-1.5">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              <span id="saveBtnLabel">儲存記錄</span>
            </button>
            <button id="cancelEditBtn" onclick="cancelEdit()" style="display:none"
              class="px-4 py-2.5 rounded-xl bg-slate-700 border border-slate-600 text-text-muted text-sm font-medium active:scale-[0.97] transition-transform shrink-0">
              取消
            </button>
          </div>
        </div>

        <!-- ── Price History ── -->
        <div>
          <div class="flex items-center gap-2 mb-2">
            <svg class="w-3.5 h-3.5 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-xs font-bold text-text-muted uppercase tracking-wider flex-1">價格記錄</span>
            <button onclick="showRecordForm()" title="新增價錢記錄"
              class="w-7 h-7 rounded-lg bg-brand/10 border border-brand/20 flex items-center justify-center text-brand hover:bg-brand/20 transition-colors active:scale-90">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </button>
          </div>
          <div id="historyList" class="space-y-1.5 max-h-72 overflow-y-auto pr-1">
          </div>
        </div>

      </div>
    </section>

    <!-- ═══════════════ BOTTOM SAVE BAR ═══════════════ -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 p-3 glass-card border-t border-slate-700/50">
      <div class="flex gap-2">
        <button onclick="saveFile()"
          class="flex-1 py-3.5 rounded-2xl bg-slate-700 border border-slate-600 text-text font-bold text-sm flex items-center justify-center gap-2 active:scale-[0.97] transition-transform hover:border-brand/50 hover:text-brand">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
          </svg>
          存檔
        </button>
        <button onclick="saveFileAs()"
          class="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-brand to-accent text-white font-bold text-sm flex items-center justify-center gap-2 active:scale-[0.97] transition-transform shadow-xl shadow-brand/25 animate-pulse-glow">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 8l-4-4m4 4l4-4" />
          </svg>
          另存新檔
        </button>
      </div>
    </div>

    <!-- Hidden file inputs for photo capture -->
    <input type="file" id="photoInputNew"    accept="image/*" capture="environment" class="hidden">
    <input type="file" id="photoInputRetake" accept="image/*" capture="environment" class="hidden">

  </div><!-- /app -->


  <!-- ═══════════════════════════════════ JAVASCRIPT ═══════════════════════════════════ -->
  <script>
    // ─── State ───
    let db = {
      products: {},
      stores: ['全聯', '家樂福', '好市多', '大全聯', '蝦皮', 'Momo'],
      units:  ['g', 'L', '罐', '瓶', '個', '斤']
    };
    let activeId           = null;
    let currentFileHandle  = null;
    let editingIndex    = null;
    let deletePendingIdx = null;
    let deletePendingTimer = null;

    // ─── DOM refs ───
    const $ = id => document.getElementById(id);
    const dbStatusBadge   = $('dbStatusBadge');
    const productSection  = $('productSection');
    const productBadge    = $('productBadge');
    const productNameInput = $('productName');
    const priceInput      = $('priceInput');
    const qtyInput        = $('qtyInput');
    const historyList     = $('historyList');
    const toastEl         = $('toast');

    // ════════════════════════════════
    //  TOAST
    // ════════════════════════════════
    let toastTimer = null;
    function showToast(message, type = 'info') {
      clearTimeout(toastTimer);
      const colors = {
        success: 'border-success/40 text-success',
        error:   'border-danger/40 text-danger',
        info:    'border-brand/40 text-brand',
        warning: 'border-warning/40 text-warning'
      };
      toastEl.className = `fixed top-16 left-0 right-0 mx-auto z-[100] px-4 py-2.5 rounded-xl glass-card shadow-2xl text-sm font-medium transition-all duration-300 max-w-[420px] w-[calc(100%-2rem)] text-center border ${colors[type] || colors.info}`;
      toastEl.textContent = message;
      requestAnimationFrame(() => {
        toastEl.style.opacity = '1';
        toastEl.style.transform = 'translateY(0)';
      });
      toastTimer = setTimeout(() => {
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translateY(-16px)';
      }, 2800);
    }

    // ════════════════════════════════
    //  DB STATUS BADGE
    // ════════════════════════════════
    function updateDbStatus() {
      const count = Object.keys(db.products).length;
      if (currentFileHandle) {
        dbStatusBadge.textContent = currentFileHandle.name.replace(/\.json$/i, '');
        dbStatusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-brand/15 text-brand transition-all duration-300 max-w-[150px] truncate';
      } else if (count > 0) {
        dbStatusBadge.textContent = `${count} 種商品`;
        dbStatusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-success/15 text-success transition-all duration-300';
      } else {
        dbStatusBadge.textContent = '空資料庫';
        dbStatusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-danger/15 text-danger transition-all duration-300';
      }
    }

    // ════════════════════════════════
    //  INDEXEDDB HELPERS
    // ════════════════════════════════
    let _idb = null;
    function getIDB() {
      if (_idb) return Promise.resolve(_idb);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('price_recorder_fs', 1);
        req.onupgradeneeded = e => {
          e.target.result.createObjectStore('recent_files', { keyPath: 'id' });
        };
        req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
        req.onerror   = () => reject(req.error);
      });
    }
    async function idbGet(id) {
      const d = await getIDB();
      return new Promise((resolve, reject) => {
        const req = d.transaction('recent_files', 'readonly').objectStore('recent_files').get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    }
    async function idbPut(entry) {
      const d = await getIDB();
      return new Promise((resolve, reject) => {
        const req = d.transaction('recent_files', 'readwrite').objectStore('recent_files').put(entry);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    }
    async function idbDelete(id) {
      const d = await getIDB();
      return new Promise((resolve, reject) => {
        const req = d.transaction('recent_files', 'readwrite').objectStore('recent_files').delete(id);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    }
    async function idbGetAll() {
      const d = await getIDB();
      return new Promise((resolve, reject) => {
        const req = d.transaction('recent_files', 'readonly').objectStore('recent_files').getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    }

    // ════════════════════════════════
    //  FILE SYSTEM ACCESS API
    // ════════════════════════════════
    const FILE_PICKER_OPTS = {
      types: [{ description: 'JSON 資料庫', accept: { 'application/json': ['.json'] } }],
      excludeAcceptAllOption: true
    };

    function applyParsedDb(parsed) {
      if (typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('格式錯誤');
      if (!parsed.products || typeof parsed.products !== 'object') throw new Error('不支援此格式');
      db.products = parsed.products;
      if (Array.isArray(parsed.stores) && parsed.stores.length) db.stores = parsed.stores;
      if (Array.isArray(parsed.units)  && parsed.units.length)  db.units  = parsed.units;
      activeId = null;
      productSection.classList.add('hidden');
      updateDbStatus();
      renderProductGrid();
      renderStoreSelect();
      renderUnitSelect();
    }

    async function verifyPermission(handle, readWrite = false) {
      const opts = { mode: readWrite ? 'readwrite' : 'read' };
      if ((await handle.queryPermission(opts)) === 'granted') return true;
      return (await handle.requestPermission(opts)) === 'granted';
    }

    async function openFile() {
      if (!window.showOpenFilePicker) {
        showToast('請使用 Chrome 瀏覽器以使用此功能', 'warning'); return;
      }
      try {
        const [handle] = await window.showOpenFilePicker(FILE_PICKER_OPTS);
        const text = await (await handle.getFile()).text();
        applyParsedDb(JSON.parse(text));
        currentFileHandle = handle;
        await idbPut({ id: handle.name, name: handle.name, handle, lastOpened: Date.now() });
        await renderRecentFiles();
        showToast(`已開啟：${Object.keys(db.products).length} 種商品`, 'success');
      } catch(e) {
        if (e.name !== 'AbortError') showToast(`開啟失敗：${e.message}`, 'error');
      }
    }

    async function saveFile() {
      if (!currentFileHandle) { await saveFileAs(); return; }
      try {
        if (!(await verifyPermission(currentFileHandle, true))) {
          showToast('無法存取檔案，請重新開啟', 'error'); return;
        }
        syncProductName();
        const writable = await currentFileHandle.createWritable();
        await writable.write(JSON.stringify(db, null, 2));
        await writable.close();
        showToast(`已存檔：${currentFileHandle.name}`, 'success');
      } catch(e) {
        if (e.name !== 'AbortError') showToast(`存檔失敗：${e.message}`, 'error');
      }
    }

    async function saveFileAs() {
      if (!window.showSaveFilePicker) {
        showToast('請使用 Chrome 瀏覽器以使用此功能', 'warning'); return;
      }
      try {
        const handle = await window.showSaveFilePicker({
          ...FILE_PICKER_OPTS,
          suggestedName: currentFileHandle ? currentFileHandle.name : 'price_database.json'
        });
        syncProductName();
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(db, null, 2));
        await writable.close();
        currentFileHandle = handle;
        await idbPut({ id: handle.name, name: handle.name, handle, lastOpened: Date.now() });
        await renderRecentFiles();
        updateDbStatus();
        showToast(`已另存新檔：${handle.name}`, 'success');
      } catch(e) {
        if (e.name !== 'AbortError') showToast(`另存失敗：${e.message}`, 'error');
      }
    }

    async function openRecentFile(id) {
      try {
        const entry = await idbGet(id);
        if (!entry) { await removeRecentFile(id); showToast('找不到此記錄', 'error'); return; }
        if (!(await verifyPermission(entry.handle, true))) {
          showToast('未取得檔案存取權限', 'warning'); return;
        }
        let text;
        try {
          text = await (await entry.handle.getFile()).text();
        } catch(e) {
          await removeRecentFile(id);
          showToast('檔案已不存在，已移除記錄', 'error'); return;
        }
        applyParsedDb(JSON.parse(text));
        currentFileHandle = entry.handle;
        await idbPut({ ...entry, lastOpened: Date.now() });
        await renderRecentFiles();
        showToast(`已開啟：${Object.keys(db.products).length} 種商品`, 'success');
      } catch(e) {
        if (e.name !== 'AbortError') showToast(`開啟失敗：${e.message}`, 'error');
      }
    }

    async function removeRecentFile(id) {
      await idbDelete(id);
      await renderRecentFiles();
    }

    async function renderRecentFiles() {
      const list = $('recentFilesList');
      if (!list) return;
      let entries = [];
      try { entries = await idbGetAll(); } catch { entries = []; }
      entries.sort((a, b) => b.lastOpened - a.lastOpened);
      if (!entries.length) { list.innerHTML = ''; return; }
      const rows = entries.map(e => {
        const d = new Date(e.lastOpened);
        const ts = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} `
          + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const isCurrent = currentFileHandle && currentFileHandle.name === e.name;
        return `
          <div class="flex items-center gap-2 py-2 px-3 rounded-lg ${isCurrent ? 'bg-brand/10 border border-brand/20' : 'bg-slate-800/50 hover:bg-slate-800/80'} transition-colors">
            <svg class="w-4 h-4 ${isCurrent ? 'text-brand' : 'text-text-muted'} shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
            </svg>
            <div class="flex-1 min-w-0">
              <div class="text-xs font-medium text-text truncate">${e.name}</div>
              <div class="text-[10px] text-slate-500 font-mono">${ts}</div>
            </div>
            <button onclick="openRecentFile('${e.id}')"
              class="px-2.5 py-1 rounded-md bg-brand/15 text-brand text-[11px] font-semibold hover:bg-brand/25 active:scale-95 transition-all shrink-0">開啟</button>
            <button onclick="removeRecentFile('${e.id}')"
              class="w-6 h-6 rounded-md flex items-center justify-center text-text-muted hover:text-danger hover:bg-danger/10 transition-colors active:scale-95 shrink-0">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>`;
      }).join('');
      list.innerHTML = `
        <div class="pt-3 border-t border-slate-700/50 mt-1">
          <span class="text-[11px] text-text-muted font-semibold uppercase tracking-wider">最近開啟的檔案</span>
          <div class="mt-2 space-y-1.5">${rows}</div>
        </div>`;
    }

    // ════════════════════════════════
    //  PRODUCT GRID
    // ════════════════════════════════
    function renderProductGrid() {
      const grid = $('productGrid');
      const ids = Object.keys(db.products);
      if (ids.length === 0) {
        grid.innerHTML = '<p class="col-span-2 text-center py-8 text-sm text-text-muted leading-relaxed">尚無商品<br>點選「拍照新增」開始記錄</p>';
        return;
      }
      grid.innerHTML = '';
      ids.forEach(id => {
        const p = db.products[id];
        const isActive = id === activeId;
        const card = document.createElement('div');
        card.className = `rounded-xl overflow-hidden cursor-pointer active:scale-[0.97] transition-all duration-150 ${
          isActive
            ? 'ring-2 ring-brand/60 border border-brand/40'

        card.onclick = () => activateProduct(id);

        const photoHtml = p.photo
          ? `<img src="${p.photo}" class="w-full h-full object-cover" loading="lazy">`

               <svg class="w-10 h-10 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                 <path stroke-linecap="round" stroke-linejoin="round"
                   d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />

    // ════════════════════════════════
    //  PHOTO CAPTURE

    function startNewProduct() {
      $('photoInputNew').click();
    }

      $('photoInputRetake').click();

    $('photoInputNew').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        showToast('處理中…', 'info');
        const dataUrl = await compressImage(file);
        const id = 'prod_' + Date.now();
        db.products[id] = { name: '', photo: dataUrl, records: [] };
        updateDbStatus();
        activateProduct(id);
        $('recordForm').style.display = '';
        $('cancelEditBtn').style.display = '';
        setTimeout(() => productNameInput.focus(), 450);
        showToast('新商品已建立，請輸入名稱', 'success');
      } catch (err) {
        showToast('照片處理失敗', 'error');
        console.error(err);
      }
      e.target.value = '';
    });

    $('photoInputRetake').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeId) return;
      try {
        showToast('處理中…', 'info');
        const dataUrl = await compressImage(file);
        db.products[activeId].photo = dataUrl;
        renderPhoto();
        renderProductGrid();
        showToast('照片已更新', 'success');
      } catch (err) {
        showToast('照片處理失敗', 'error');
        console.error(err);
      }
      e.target.value = '';
    });

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const MAX = 800;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > MAX || h > MAX) {
            const r = Math.min(MAX / w, MAX / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
        img.src = url;
      });
    }

    // ════════════════════════════════
    //  PRODUCT ACTIVATE / CLOSE
    // ════════════════════════════════
    function activateProduct(id) {
      syncProductName();
      // reset form state when switching products
      editingIndex = null;
      deletePendingIdx = null;
      clearTimeout(deletePendingTimer);
      priceInput.value = '';
      qtyInput.value   = '';
      $('saveBtnLabel').textContent = '儲存記錄';
      $('cancelEditBtn').style.display = 'none';
      $('recordForm').style.display = 'none';
      activeId = id;
      const p = db.products[id];
      productNameInput.value = p.name || '';
      const count = p.records.length;
      productBadge.textContent = `${count} 筆記錄`;
      productBadge.className = count > 0
        ? 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-brand/15 text-brand'
        : 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-warning/15 text-warning';
      renderStoreSelect();
      renderUnitSelect();
      renderHistory();
      renderPhoto();
      renderProductGrid();
      productSection.classList.remove('hidden');
      const card = productSection.querySelector('.glass-card');
      card.classList.remove('animate-fade-in');
      void card.offsetWidth;
      card.classList.add('animate-fade-in');
      productSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeProduct() {
      syncProductName();
      cancelEdit();
      activeId = null;
      renderProductGrid();
      productSection.classList.add('hidden');
      $('productGrid').closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function syncProductName() {
      if (!activeId || !db.products[activeId]) return;
      db.products[activeId].name = productNameInput.value.trim();
    }
    productNameInput.addEventListener('blur', syncProductName);

    // ════════════════════════════════
    //  RENDER PHOTO
    // ════════════════════════════════
    function renderPhoto() {
      const photo = db.products[activeId]?.photo;
      if (photo) {
        $('productPhoto').src = photo;
        $('photoDisplay').classList.remove('hidden');
        $('noPhotoPlaceholder').classList.add('hidden');
      } else {
        $('photoDisplay').classList.add('hidden');
        $('noPhotoPlaceholder').classList.remove('hidden');
      }
    }

    // ════════════════════════════════
    //  STORE MANAGEMENT
    // ════════════════════════════════
    function renderStoreSelect() {
      const sel = $('storeSelect');
      const prev = sel.value;
      sel.innerHTML = '';
      db.stores.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });
      if (db.stores.includes(prev)) sel.value = prev;
    }

    function showAddStore() {
      const row = $('addStoreRow');
      row.style.display = 'flex';
      $('newStoreName').focus();
    }

    function cancelAddStore() {
      $('addStoreRow').style.display = 'none';
      $('newStoreName').value = '';
    }

    function confirmNewStore() {
      const name = $('newStoreName').value.trim();
      if (!name) { showToast('請輸入購買處名稱', 'warning'); return; }
      if (db.stores.includes(name)) { showToast('此購買處已存在', 'warning'); return; }
      db.stores.push(name);
      renderStoreSelect();
      $('storeSelect').value = name;
      cancelAddStore();
      showToast(`已新增：${name}`, 'success');
    }

    $('newStoreName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmNewStore(); }
    });

    // ════════════════════════════════
    //  UNIT MANAGEMENT
    // ════════════════════════════════
    function renderUnitSelect() {
      const sel = $('unitSelect');
      const prev = sel.value;
      sel.innerHTML = '';
      db.units.forEach(u => {
        const opt = document.createElement('option');
        opt.value = opt.textContent = u;
        sel.appendChild(opt);
      });
      if (prev && db.units.includes(prev)) sel.value = prev;
    }

    function showAddUnit() {
      $('addUnitRow').style.display = 'flex';
      $('newUnitName').focus();
    }

    function cancelAddUnit() {
      $('addUnitRow').style.display = 'none';
      $('newUnitName').value = '';
    }

    function confirmNewUnit() {
      const name = $('newUnitName').value.trim();
      if (!name) { showToast('請輸入單位名稱', 'warning'); return; }
      if (db.units.includes(name)) { showToast('此單位已存在', 'warning'); return; }
      db.units.push(name);
      renderUnitSelect();
      $('unitSelect').value = name;
      cancelAddUnit();
      showToast(`已新增：${name}`, 'success');
    }

    $('newUnitName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmNewUnit(); }
    });

    // ════════════════════════════════
    //  RECORD EDIT / DELETE
    // ════════════════════════════════
    function showRecordForm() {
      editingIndex = null;
      $('saveBtnLabel').textContent = '儲存記錄';
      $('recordForm').style.display = '';
      $('cancelEditBtn').style.display = '';
      $('recordForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function editRecord(origIdx) {
      const rec = db.products[activeId].records[origIdx];
      $('storeSelect').value = rec.store;
      priceInput.value = rec.price;
      qtyInput.value  = rec.qty;
      $('unitSelect').value = rec.unit;
      editingIndex = origIdx;
      $('saveBtnLabel').textContent = '更新記錄';
      $('recordForm').style.display = '';
      $('cancelEditBtn').style.display = '';
      $('recordForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      renderHistory();
    }

    function cancelEdit() {
      editingIndex = null;
      priceInput.value = '';
      qtyInput.value   = '';
      $('saveBtnLabel').textContent = '儲存記錄';
      $('cancelEditBtn').style.display = 'none';
      $('recordForm').style.display = 'none';
      renderHistory();
    }

    function deleteRecord(origIdx) {
      if (deletePendingIdx === origIdx) {
        clearTimeout(deletePendingTimer);
        deletePendingIdx = null;
        if (editingIndex === origIdx) {
          editingIndex = null;
          priceInput.value = '';
          qtyInput.value   = '';
          $('saveBtnLabel').textContent = '儲存記錄';
          $('cancelEditBtn').style.display = 'none';
        } else if (editingIndex !== null && editingIndex > origIdx) {
          editingIndex--;
        }
        db.products[activeId].records.splice(origIdx, 1);
        const count = db.products[activeId].records.length;
        productBadge.textContent = `${count} 筆記錄`;
        productBadge.className = count
          ? 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-brand/15 text-brand'
          : 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-warning/15 text-warning';
        renderHistory();
        renderProductGrid();
        showToast('已刪除記錄', 'info');
      } else {
        deletePendingIdx = origIdx;
        clearTimeout(deletePendingTimer);
        deletePendingTimer = setTimeout(() => {
          deletePendingIdx = null;
          renderHistory();
        }, 3000);
        renderHistory();
      }
    }

    // ════════════════════════════════
    //  SAVE PRICE RECORD
    // ════════════════════════════════
    function saveRecord() {
      if (!activeId) return;
      syncProductName();

      const name = productNameInput.value.trim();
      if (!name) { showToast('請先輸入商品名稱', 'warning'); productNameInput.focus(); return; }

      const store = $('storeSelect').value;
      if (!store) { showToast('請選擇購買處', 'warning'); return; }

      const price = parseFloat(priceInput.value);
      if (isNaN(price) || price < 0) { showToast('請輸入有效的價格', 'warning'); priceInput.focus(); return; }

      const qty = parseFloat(qtyInput.value);
      if (isNaN(qty) || qty <= 0) { showToast('數量必須大於 0', 'warning'); qtyInput.focus(); return; }

      const unit = $('unitSelect').value;
      if (!unit) { showToast('請選擇單位', 'warning'); return; }

      const d = new Date();
      const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      if (editingIndex !== null) {
        db.products[activeId].records[editingIndex] = { store, price, qty, unit, date };
        showToast(`已更新：${store}  NT$${price} / ${qty}${unit}`, 'success');
      } else {
        db.products[activeId].records.push({ store, price, qty, unit, date });
        showToast(`已儲存：${store}  NT$${price} / ${qty}${unit}`, 'success');
      }
      editingIndex = null;
      priceInput.value = '';
      qtyInput.value   = '';
      $('saveBtnLabel').textContent = '儲存記錄';
      $('cancelEditBtn').style.display = 'none';
      $('recordForm').style.display = 'none';

      const count = db.products[activeId].records.length;
      productBadge.textContent = `${count} 筆記錄`;
      productBadge.className = 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-brand/15 text-brand';

      renderHistory();
      renderProductGrid();
    }

    // ════════════════════════════════
    //  RENDER PRICE HISTORY
    // ════════════════════════════════

    // Colors cycle through the palette for any store (including user-added ones)
    const COLOR_PALETTE = [
      'bg-emerald-500/15 text-emerald-400',
      'bg-blue-500/15    text-blue-400',
      'bg-red-500/15     text-red-400',
      'bg-orange-500/15  text-orange-400',
      'bg-teal-500/15    text-teal-400',
      'bg-cyan-500/15    text-cyan-400',
      'bg-pink-500/15    text-pink-400',
      'bg-violet-500/15  text-violet-400',
      'bg-amber-500/15   text-amber-400',
      'bg-lime-500/15    text-lime-400',
    ];
    function storeColor(store) {
      const idx = db.stores.indexOf(store);
      return idx >= 0
        ? COLOR_PALETTE[idx % COLOR_PALETTE.length]
        : 'bg-slate-600/30 text-slate-300';
    }

    function renderHistory() {
      historyList.innerHTML = '';
      const p = db.products[activeId];
      if (!p?.records?.length) {
        historyList.innerHTML = `
          <div class="text-center py-6 text-text-muted text-sm">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
            </svg>
            尚無價格記錄
          </div>`;
        return;
      }

      // Sort newest first, preserving original indices
      const sortedWithIdx = p.records
        .map((r, i) => ({ r, i }))
        .sort((a, b) => b.r.date.localeCompare(a.r.date));

      // Compute unit prices
      const unitPrices = sortedWithIdx.map(({ r }) => r.qty > 0 ? r.price / r.qty : Infinity);
      const valid  = unitPrices.filter(v => isFinite(v));
      const minUP  = valid.length > 1 ? Math.min(...valid) : null;
      const maxUP  = valid.length > 1 ? Math.max(...valid) : null;

      sortedWithIdx.forEach(({ r: rec, i: origIdx }, idx) => {
        const up    = unitPrices[idx];
        const isMin = minUP !== null && up === minUP;
        const isMax = maxUP !== null && up === maxUP;
        const chip  = storeColor(rec.store);
        const upStr = isFinite(up)
          ? `NT$${+(up.toFixed(2))}/${rec.unit || '份'}`
          : '—';

        const isEditing  = editingIndex === origIdx;
        const isPending  = deletePendingIdx === origIdx;

        const row = document.createElement('div');
        row.className = `py-2.5 px-3 rounded-lg transition-colors ${
          isEditing
            ? 'bg-brand/10 border border-brand/30'
            : 'bg-slate-800/40 hover:bg-slate-800/70'
        }`;
        row.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-[11px] font-medium ${chip} px-2 py-0.5 rounded-md whitespace-nowrap">${rec.store}</span>
              <span class="text-xs text-text-muted font-mono">${rec.date}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0 ml-2">
              <span class="text-sm font-bold text-text tabular-nums">NT$${rec.price}</span>
              <button onclick="editRecord(${origIdx})"
                class="w-7 h-7 rounded-md flex items-center justify-center transition-colors ${isEditing ? 'text-brand' : 'text-text-muted hover:text-brand hover:bg-brand/10'}">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z" />
                </svg>
              </button>
              ${isPending
                ? `<button onclick="deleteRecord(${origIdx})"
                    class="h-7 px-2 rounded-md bg-danger/80 text-white text-[11px] font-bold active:scale-95 transition-transform">確認刪除</button>`
                : `<button onclick="deleteRecord(${origIdx})"
                    class="w-7 h-7 rounded-md flex items-center justify-center text-text-muted hover:text-danger hover:bg-danger/10 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                    </svg>
                  </button>`
              }
            </div>
          </div>
          <div class="flex items-center justify-between pl-0.5">
            <span class="text-xs text-text-muted">${rec.qty} ${rec.unit || '份'}</span>
            <span class="text-xs font-semibold tabular-nums ${isMin ? 'text-success' : isMax ? 'text-danger' : 'text-text-muted'}">
              ${isMin ? '▼ ' : isMax ? '▲ ' : ''}單價 ${upStr}
            </span>
          </div>`;
        historyList.appendChild(row);
      });
    }

    // ════════════════════════════════
    //  INIT
    // ════════════════════════════════
    updateDbStatus();
    renderProductGrid();
    renderStoreSelect();
    renderUnitSelect();
    renderRecentFiles();

    // ════════════════════════════════
    //  SERVICE WORKER (PWA homescreen)
    // ════════════════════════════════
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install',  e => { self.skipWaiting(); });
        self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
        self.addEventListener('fetch',    e => { e.respondWith(fetch(e.request)); });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>

</body>
</html>
